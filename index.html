<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Tareas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Danely's CRUD de Tareas</h1>

        <p class="subtitle">
            Organiza tus tareas de forma sencilla
        </p>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Escribe una nueva tarea...">

            <button id="addBtn">
                Agregar
            </button>
        </div>

        <p id="taskCounter">
            Total de tareas: 0
        </p>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
